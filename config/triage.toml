# Réglages du modèle de triage. Aucun secret ici.
# Les poids sont des "poids d'évidence" en log-odds (voir docs/triage-model.md) :
# +1.0 multiplie environ par 2,7 la cote "à notifier", -1.0 la divise d'autant.

[thresholds]
notify = 0.70      # p >= notify  -> NOTIFY (JIRA)
review = 0.40      # review <= p < notify -> REVIEW (analyste)
                   # p < review   -> SUPPRESS

[prior]
# Log-odds de départ : fréquence de base estimée des vrais positifs.
# -2.2 ~ 10 % des événements Flare réellement à notifier. À recalibrer.
base_log_odds = -2.2

[weights.category]   # impact intrinsèque de la catégorie
credential_exposure  = 1.2
infected_device      = 2.0
data_leak            = 1.8
source_code_secret   = 1.6
brand_impersonation  = 0.9
financial_fraud      = 1.4
threat_actor_chatter = 0.2
attack_surface       = 0.6
other                = 0.0

[weights.severity]   # sévérité Flare (ou override tenant)
info     = -1.5
low      = -0.6
medium   = 0.3
high     = 1.2
critical = 2.0

[weights.signals]    # indicateurs d'exploitabilité
credential_valid       = 1.5
credential_invalid     = -1.5
has_password_plain     = 0.8
has_password_hash      = 0.2
has_session_cookies    = 1.2
contains_secrets       = 1.3
critical_identifier    = 1.0   # l'identifiant touché est marqué critique ci-dessous
known_actor            = 0.5   # acteur présent dans la watchlist
burst                  = 0.6   # catégorie en pic de volume
novelty                = 0.8   # multiplié par le score d'anomalie (0..1)
duplicate              = -3.0
old_event              = -1.0  # multiplié par (1 - fraîcheur)

[freshness]
half_life_days = 30     # décroissance exponentielle de la fraîcheur

[source_reliability]
# Échelle inspirée du code de l'Amirauté (A=fiable ... F=inconnu), en log-odds.
default = 0.0
valid_credential = 0.5
stealer_log = 0.4
ransomleak = 0.4
paste = -0.3
google = -0.4
social_media = -0.2

[context]
critical_identifiers = []          # ex. ["vpn.client.com", "@client.com"]
actor_watchlist = []               # ex. ["lockbit", "scattered spider"]
suppress_status = ["remediated", "ignored"]
always_notify_types = []           # ex. ["valid_credential"]
never_notify_types = []            # ex. ["google"]

[dedup]
simhash_max_hamming = 3

[learning]
# Poids du modèle supervisé : w = n / (n + k), n = nb de labels analystes.
blend_k = 200
min_labels = 30
learning_rate = 0.05
l2 = 0.001
epochs = 30

[anomaly]
enabled = true
n_trees = 100
sample_size = 256
min_history = 200
